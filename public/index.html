<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caja Fiscal - Demo Abasto</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="ticket-lateral"></div>
  <main class="container">
    <section class="panel">
      <h1>Caja Fiscal Demo</h1>
      <p>Factura tipo abasto con productos hardcodeados para prueba de impresión fiscal.</p>
    </section>

    <section class="panel grid cols-2">
      <div>
        <label>RIF</label>
        <input id="rif" value="V-12345678-9" />
      </div>
      <div>
        <label>Cliente</label>
        <input id="nombre" value="COMERCIAL LA FLORESTA C.A." />
      </div>
      <div class="cols-2" style="grid-column: 1 / -1;">
        <label>Direccion</label>
        <input id="direccion" value="AV. BOLIVAR, CENTRO EMPRESARIAL" />
      </div>
    </section>

    <section class="panel">
      <h2>Productos fijos de prueba</h2>
      <table>
        <thead>
          <tr>
            <th>Tipo</th>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio</th>
          </tr>
        </thead>
        <tbody id="tabla-productos"></tbody>
      </table>
    </section>


    <section class="panel grid cols-2">
      <div>
        <label for="tipo-pago">Tipo de pago</label>
        <select id="tipo-pago">
          <option value="efectivo">Efectivo</option>
          <option value="banco">Banco</option>
        </select>
      </div>
      <div>
        <label for="monto-pago">Monto</label>
        <input id="monto-pago" type="number" min="0" step="0.01" value="500.00" />
      </div>
    </section>

    <section class="panel actions">
      <button id="btn-enviar">Enviar factura</button>
      <span id="estado" class="badge">Listo para enviar</span>
    </section>

    <section class="panel grid cols-2">
      <div>
        <h3>Trama generada</h3>
        <pre id="trama"></pre>
      </div>
      <div>
        <h3>Respuesta del servidor</h3>
        <pre id="respuesta"></pre>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
